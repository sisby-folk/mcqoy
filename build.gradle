import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
	alias libs.plugins.githubRelease
	alias libs.plugins.minotaur
	alias libs.plugins.curse
	id "com.gradleup.shadow" version "9.0.0-beta17"
}

version = "$modVersion-cloth+$branchName"
archivesBaseName = project.slug

repositories {
	maven { url "https://repo.sleeping.town/" }
	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft libs.mc
	mappings variantOf(libs.yarn) { classifier "v2" }

	forge libs.forge

	shadow libs.kaleido
	modImplementation libs.cloth
}

shadowJar {
	configurations = [project.configurations.shadow]
}

remapJar {
	dependsOn(shadowJar)
	input = shadowJar.archivePath
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}${contributors ? ". Contributions by ${contributors}." : ""}",
		mc            : compatibleVersions.split(", ")[0],
		cloth          : libs.versions.cloth.get(),
	]
	inputs.properties meta
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
	filesMatching("pack.mcmeta") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${archivesBaseName}" }
	}
}

publishing {
	repositories {
	}
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

githubRelease {
	token = "$System.env.GITHUB_TOKEN"
	owner = project.user
	repo = slug
	tagName = "v${modVersion}+${branchName}"
	targetCommitish = branchName
	releaseAssets = remapJar
	allowUploadToExisting = true
	generateReleaseNotes = true
	body = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text
}

modrinth {
	token = "$System.env.MODRINTH_TOKEN"
	projectId = slug
	versionNumber = project.version
	uploadFile = remapJar
	gameVersions = compatibleVersions.split(", ").toList()
	loaders = compatibleLoaders.split(", ").toList()
	changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${modVersion}+${branchName}"
	syncBodyFrom = rootProject.file("README.md").text
	dependencies {
		required.project "cloth-config"
	}
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = "$System.env.CURSEFORGE_TOKEN"
	disableVersionDetection()
	def projectId = "1402884"
	def mainFile = upload(projectId, remapJar)
	compatibleLoaders.split(", ").toList().forEach { mainFile.addModLoader(it) }
	compatibleVersions.split(", ").toList().forEach { mainFile.addGameVersion(it) }
	mainFile.addEnvironment("client")
	mainFile.addRequirement("cloth-config")
	mainFile.changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${modVersion}+${branchName}"
	mainFile.changelogType = "markdown"
	mainFile.releaseType = "release"
}

